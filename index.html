<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private Cloud Gallery</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between font-sans antialiased">

  <main class="w-full max-w-5xl px-4 py-8 flex-1 flex flex-col justify-center items-center">

    <div id="login-view" class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center">
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
        🔒
      </div>
      <h1 class="text-2xl font-bold mb-2 tracking-tight">프라이빗 갤러리</h1>
      <p class="text-slate-400 text-sm mb-8">초대받은 계정으로 로그인하여 미디어를 공유하세요.</p>
      
      <button id="login-btn" onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3.5 px-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition active:scale-95">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
        <span id="login-btn-text">Google 계정 선택 및 로그인</span>
      </button>
      <p id="error-msg" class="text-xs text-rose-400 mt-4 min-h-[1rem] break-all"></p>
    </div>

    <div id="denied-view" class="hidden w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center">
      <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl">
        ⛔
      </div>
      <h2 class="text-xl font-bold mb-2">접근 권한이 없습니다</h2>
      <p id="denied-email" class="text-slate-400 text-sm mb-6 break-all"></p>
      <button onclick="logout()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-5 rounded-xl transition">
        다른 계정으로 로그인
      </button>
    </div>

    <div id="gallery-view" class="hidden w-full space-y-8">
      
      <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/60 border border-slate-800 p-5 rounded-2xl backdrop-blur-md">
        <div>
          <h1 class="text-xl font-bold flex items-center gap-2">
            <span>📷</span> 프라이빗 미디어 공간
          </h1>
          <p id="user-info" class="text-xs text-indigo-400 mt-1 font-mono"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl border border-slate-700 transition">
          로그아웃
        </button>
      </header>

      <section class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <span>📤</span> 사진 및 동영상 업로드
        </h2>
        
        <div class="flex flex-col sm:flex-row items-center gap-3">
          <input type="file" id="file-input" accept="image/*,video/*" class="block w-full text-xs text-slate-400 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer bg-slate-950 p-2 rounded-xl border border-slate-800">
          <button id="upload-btn" onclick="uploadFile()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-6 py-3 rounded-xl transition whitespace-nowrap shadow-lg">
            업로드하기
          </button>
        </div>
        <p id="upload-status" class="text-xs text-indigo-400 font-mono mt-2 min-h-[1rem]"></p>
      </section>

      <section>
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
      </section>

    </div>

  </main>

  <script>
    // 초대받은 이메일 목록
    const ALLOWED_EMAILS = [
      "doyulnam11@gmail.com",
      "doyulnam1004@gmail.com",
      "example3@gmail.com",
      "example4@gmail.com",
      "example5@gmail.com",
      "example6@gmail.com"
    ];

    // 전달해주신 진짜 API 키 적용 완료
    const firebaseConfig = {
      apiKey: "AIzaSyATswOi26eXwrwnGia2b8-uFdLJlVAhRME",
      authDomain: "save-photos-persona.firebaseapp.com",
      projectId: "save-photos-persona",
      storageBucket: "save-photos-persona.firebasestorage.app",
      messagingSenderId: "931044756030",
      appId: "1:931044756030:web:571553771b34cd07955f6f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const storage = firebase.storage();

    function loginWithGoogle() {
      const errorMsg = document.getElementById('error-msg');
      const btnText = document.getElementById('login-btn-text');
      errorMsg.innerText = '';
      btnText.innerText = '로그인 진행 중...';

      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });

      auth.signInWithPopup(provider)
        .then(result => {
          btnText.innerText = 'Google 계정 선택 및 로그인';
        })
        .catch(error => {
          btnText.innerText = 'Google 계정 선택 및 로그인';
          console.error(error);
          
          if (error.code === 'auth/unauthorized-domain') {
            errorMsg.innerText = '⚠️ 파이어베이스 콘솔(Authentication -> Settings -> Authorized domains)에 도메인 등록이 필요합니다.';
          } else if (error.code === 'auth/popup-blocked') {
            auth.signInWithRedirect(provider);
          } else if (error.code !== 'auth/popup-closed-by-user') {
            errorMsg.innerText = '오류: ' + error.message;
          }
        });
    }

    function logout() {
      auth.signOut().then(() => window.location.reload());
    }

    async function uploadFile() {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];
      if (!file) return alert('업로드할 미디어를 선택해 주세요!');

      const statusText = document.getElementById('upload-status');
      const uploadBtn = document.getElementById('upload-btn');

      uploadBtn.disabled = true;
      uploadBtn.classList.add('opacity-50', 'cursor-not-allowed');
      statusText.innerText = '업로드 시작 중...';

      const storageRef = storage.ref('gallery/' + Date.now() + '_' + file.name);
      const uploadTask = storageRef.put(file);

      uploadTask.on('state_changed', 
        (snapshot) => {
          const progress = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
          statusText.innerText = `업로드 진행 중: ${progress}%`;
        }, 
        (error) => {
          alert('업로드 실패: ' + error.message);
          statusText.innerText = '';
          uploadBtn.disabled = false;
          uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }, 
        async () => {
          statusText.innerText = '🎉 업로드 완료!';
          fileInput.value = '';
          uploadBtn.disabled = false;
          uploadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
          setTimeout(() => { statusText.innerText = ''; }, 3000);
          await loadGallery();
        }
      );
    }

    async function loadGallery() {
      const galleryGrid = document.getElementById('gallery-grid');
      galleryGrid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">미디어 목록을 불러오는 중...</div>';

      try {
        const listRef = storage.ref('gallery');
        const res = await listRef.listAll();

        if (res.items.length === 0) {
          galleryGrid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">저장된 미디어가 없습니다.</div>';
          return;
        }

        galleryGrid.innerHTML = '';
        for (const itemRef of res.items) {
          const url = await itemRef.getDownloadURL();
          const metadata = await itemRef.getMetadata();
          const isVideo = metadata.contentType && metadata.contentType.startsWith('video');

          const card = document.createElement('div');
          card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition";

          if (isVideo) {
            card.innerHTML = `
              <div class="relative bg-black aspect-video flex items-center justify-center">
                <video controls class="w-full h-full object-contain">
                  <source src="${url}" type="${metadata.contentType || 'video/mp4'}">
                </video>
              </div>
              <div class="p-3 text-xs text-slate-400 truncate flex items-center justify-between">
                <span>🎥 ${itemRef.name.split('_').slice(1).join('_') || itemRef.name}</span>
              </div>
            `;
          } else {
            card.innerHTML = `
              <div class="relative bg-slate-950 aspect-square overflow-hidden">
                <img src="${url}" alt="사진" class="w-full h-full object-cover hover:scale-105 transition duration-300" loading="lazy">
              </div>
              <div class="p-3 text-xs text-slate-400 truncate flex items-center justify-between">
                <span>🖼️ ${itemRef.name.split('_').slice(1).join('_') || itemRef.name}</span>
              </div>
            `;
          }
          galleryGrid.appendChild(card);
        }
      } catch (error) {
        console.error(error);
        galleryGrid.innerHTML = `<div class="col-span-full text-center text-rose-400 py-12">갤러리 로딩 실패<br><span class="text-xs text-slate-600">${error.message}</span></div>`;
      }
    }

    auth.onAuthStateChanged(async user => {
      const loginView = document.getElementById('login-view');
      const deniedView = document.getElementById('denied-view');
      const galleryView = document.getElementById('gallery-view');

      if (user) {
        loginView.classList.add('hidden');
        if (ALLOWED_EMAILS.includes(user.email)) {
          deniedView.classList.add('hidden');
          galleryView.classList.remove('hidden');
          document.getElementById('user-info').innerText = `${user.displayName || '사용자'} (${user.email})`;
          await loadGallery();
        } else {
          galleryView.classList.add('hidden');
          deniedView.classList.remove('hidden');
          document.getElementById('denied-email').innerText = `접속된 계정: ${user.email}`;
        }
      } else {
        loginView.classList.remove('hidden');
        deniedView.classList.add('hidden');
        galleryView.classList.add('hidden');
      }
    });
  </script>
</body>
</html>

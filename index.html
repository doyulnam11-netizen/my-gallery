<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프라이빗 링크 갤러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between font-sans antialiased">
  <main class="w-full max-w-5xl px-4 py-8 flex-1 flex flex-col justify-center items-center">
    
    <div id="login-view" class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center">
      <div class="w-16 h-16 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
        🔒
      </div>
      <h1 class="text-2xl font-bold mb-2 tracking-tight">프라이빗 갤러리</h1>
      <p class="text-slate-400 text-sm mb-8">초대받은 계정으로 로그인하여 미디어를 공유하세요.</p>
      
      <button onclick="loginWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-900 font-semibold py-3.5 px-5 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition active:scale-95">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5" alt="Google">
        <span>Google 계정 선택 및 로그인</span>
      </button>
    </div>

    <div id="denied-view" class="hidden w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl text-center">
      <div class="w-16 h-16 bg-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto mb-6 text-3xl">
        ⛔
      </div>
      <h2 class="text-xl font-bold mb-2">접근 권한이 없습니다</h2>
      <p id="denied-email" class="text-slate-400 text-sm mb-6 break-all"></p>
      <button onclick="logout()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 px-5 rounded-xl transition">
        다른 계정으로 로그인
      </button>
    </div>

    <div id="gallery-view" class="hidden w-full space-y-8">
      
      <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-slate-900/60 border border-slate-800 p-5 rounded-2xl backdrop-blur-md">
        <div>
          <h1 class="text-xl font-bold flex items-center gap-2">
            <span>📷</span> 프라이빗 미디어 공간
          </h1>
          <p id="user-info" class="text-xs text-indigo-400 mt-1 font-mono"></p>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2.5 rounded-xl border border-slate-700 transition">
          로그아웃
        </button>
      </header>

      <section class="bg-slate-900/80 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-4">
        <h2 class="text-sm font-semibold text-slate-300 flex items-center gap-2">
          <span>🔗</span> 유튜브 또는 Imgur 링크 등록하기
        </h2>
        
        <div class="space-y-3">
          <input type="text" id="media-title" placeholder="제목을 입력하세요" class="w-full bg-slate-950 border border-slate-800 text-sm rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
          <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" id="media-url" placeholder="유튜브 링크 또는 Imgur 이미지 직접 링크 주소 입력" class="w-full bg-slate-950 border border-slate-800 text-sm rounded-xl p-3 text-white focus:outline-none focus:border-indigo-500">
            <button onclick="addMedia()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-6 py-3 rounded-xl transition whitespace-nowrap shadow-lg">
              등록하기
            </button>
          </div>
        </div>
      </section>

      <section>
        <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
        </div>
      </section>

    </div>

  </main>

  <script>
    const ALLOWED_EMAILS = [
      "doyulnam11@gmail.com",
      "doyulnam1004@gmail.com"
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyATswOi26eXwrwnGia2b8-uFdLJlVAhRME",
      authDomain: "save-photos-persona.firebaseapp.com",
      projectId: "save-photos-persona",
      storageBucket: "save-photos-persona.firebasestorage.app",
      messagingSenderId: "931044756030",
      appId: "1:931044756030:web:571553771b34cd07955f6f"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function loginWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      auth.signInWithPopup(provider).catch(error => {
        if (error.code === 'auth/popup-blocked') {
          auth.signInWithRedirect(provider);
        }
      });
    }

    function logout() {
      auth.signOut().then(() => window.location.reload());
    }

    function getYouTubeEmbedUrl(url) {
      let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      let match = url.match(regExp);
      return (match && match[2].length === 11) ? 'https://www.youtube.com/embed/' + match[2] : null;
    }

    async function addMedia() {
      const title = document.getElementById('media-title').value.trim();
      const url = document.getElementById('media-url').value.trim();

      if (!title || !url) return alert('제목과 링크를 모두 입력해 주세요!');

      let type = 'image';
      let finalUrl = url;

      const ytEmbed = getYouTubeEmbedUrl(url);
      if (ytEmbed) {
        type = 'youtube';
        finalUrl = ytEmbed;
      }

      try {
        await db.collection('posts').add({
          title: title,
          url: finalUrl,
          type: type,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('media-title').value = '';
        document.getElementById('media-url').value = '';
        loadGallery();
      } catch (error) {
        alert('등록 실패: ' + error.message);
      }
    }

    async function loadGallery() {
      const galleryGrid = document.getElementById('gallery-grid');
      galleryGrid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">목록을 불러오는 중...</div>';

      try {
        const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').get();

        if (snapshot.empty) {
          galleryGrid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-12">등록된 미디어가 없습니다.</div>';
          return;
        }

        galleryGrid.innerHTML = '';
        snapshot.forEach(doc => {
          const data = doc.data();
          const card = document.createElement('div');
          card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 transition";

          if (data.type === 'youtube') {
            card.innerHTML = `
              <div class="relative bg-black aspect-video flex items-center justify-center">
                <iframe class="w-full h-full" src="${data.url}" frameborder="0" allowfullscreen></iframe>
              </div>
              <div class="p-3 text-xs text-slate-300 font-medium truncate">
                🎥 ${data.title}
              </div>
            `;
          } else {
            card.innerHTML = `
              <div class="relative bg-slate-950 aspect-square overflow-hidden">
                <img src="${data.url}" alt="사진" class="w-full h-full object-cover hover:scale-105 transition duration-300" loading="lazy">
              </div>
              <div class="p-3 text-xs text-slate-300 font-medium truncate">
                🖼️ ${data.title}
              </div>
            `;
          }
          galleryGrid.appendChild(card);
        });
      } catch (error) {
        galleryGrid.innerHTML = `<div class="col-span-full text-center text-rose-400 py-12">로딩 실패</div>`;
      }
    }

    auth.onAuthStateChanged(async user => {
      const loginView = document.getElementById('login-view');
      const deniedView = document.getElementById('denied-view');
      const galleryView = document.getElementById('gallery-view');

      if (user) {
        loginView.classList.add('hidden');
        if (ALLOWED_EMAILS.includes(user.email)) {
          deniedView.classList.add('hidden');
          galleryView.classList.remove('hidden');
          document.getElementById('user-info').innerText = `${user.displayName || '사용자'} (${user.email})`;
          await loadGallery();
        } else {
          galleryView.classList.add('hidden');
          deniedView.classList.remove('hidden');
          document.getElementById('denied-email').innerText = `접속된 계정: ${user.email}`;
        }
      } else {
        loginView.classList.remove('hidden');
        deniedView.classList.add('hidden');
        galleryView.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
